server {
    listen 80;
    listen [::]:80;
    server_name api.quakenow.ovh;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.quakenow.ovh;

    ssl_certificate /etc/letsencrypt/live/quakenow.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quakenow.ovh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Socket.IO / WebSocket
    location /socket.io/ {
        set $ea_worker "http://ea-worker:6000";
        proxy_pass $ea_worker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE Stream
    location /api/earthquakes/stream {
        set $ea_worker "http://ea-worker:6000";
        proxy_pass $ea_worker;
        proxy_buffering off;
        proxy_set_header Cache-Control no-cache;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Direct /api/* to backend without double prefix
    location /api/ {
        set $ea_worker "http://ea-worker:6000";
        proxy_pass $ea_worker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Convenience: allow paths without /api prefix (e.g., /earthquakes)
    location / {
        set $ea_worker "http://ea-worker:6000";
        rewrite ^/(.*)$ /api/$1 break;
        proxy_pass $ea_worker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}