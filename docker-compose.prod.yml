version: '3.8'

services:
  app: 
    container_name: ea-worker
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "51763:6000"
    depends_on:
      mongo:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    networks:
      - earthquake_network
    environment:
      REDIS_HOST: ea-dragonfly
      REDIS_PORT: 6379
      DRAGONFLY_HOST: ea-dragonfly
      DRAGONFLY_PORT: 6379
      MQTT_BROKER_URL: "mqtt://ea-emqx:1883"
      MONGO_USERNAME: root
      MONGO_PASSWORD: root
      MONGO_HOST: ea-mongodb
      MONGO_PORT: 27017
      MONGO_DB: earthquake_db
      MONGO_URL: "mongodb://root:root@ea-mongodb:27017/earthquake_db"
      MONGODB_URI: "mongodb://root:root@ea-mongodb:27017/earthquake_db?authSource=admin"
      MONGO_CLOUD_URL: "mongodb+srv://admin:iamshuvo123@earthquake.a0xu3p0.mongodb.net/?retryWrites=true&w=majority"
      CORS_ORIGIN: "https://quakenow.ovh,https://www.quakenow.ovh,http://quakenow.ovh,http://www.quakenow.ovh"

  mongo:  
    container_name: ea-mongodb
    image: "mongo:7.0.2"
    restart: unless-stopped
    ports:
      - "43982:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    networks:
      - earthquake_network
    volumes:
      - ./mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  dragonfly:
    container_name: ea-dragonfly
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - earthquake_network
    ulimits:
      memlock: -1
    volumes:
      - ./dragonfly_data:/data
    command: >
      dragonfly
      --maxmemory=2gb
      --maxmemory_policy=noeviction
      --hz=100
      --tcp_nodelay=true
      --default_lua_flags=allow-undeclared-keys
      --dbfilename=earthquake-snapshot
      --dir=/data
      --snapshot_cron="*/30 * * * *"
      --proactor_threads=2
    deploy:
      resources:
        limits:
          memory: 2.5G
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mqtt:
    container_name: ea-emqx
    image: "emqx/emqx:5.0.0"
    restart: unless-stopped
    ports:
      - "45329:1883"      # MQTT (internal)
      - "47754:8883"      # MQTT TLS (external)
      - "48083:8083"      # WebSocket
      - "48084:8084"      # WebSocket Secure
      - "18083:18083"     # Dashboard
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: emqx
      EMQX_NODE__COOKIE: emqx_secret_cookie
    networks:
      - earthquake_network
    volumes:
      - ./emqx_data:/opt/emqx/data
      - ./emqx_logs:/opt/emqx/log

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    restart: unless-stopped
    hostname: rabbitmq
    ports:
      - "42107:5672"
      - "49876:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit
    networks:
      - earthquake_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  earthquake_network:
    external: true
